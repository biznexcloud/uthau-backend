version: "3.9"

services:
  app:
    build: .
    ports:
      - "8002:8002"
      - "8003:8003"
    env_file: .env
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
